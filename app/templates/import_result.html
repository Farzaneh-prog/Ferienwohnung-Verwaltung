<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>نتیجه Import</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f2143; color: #f5f4f0; margin: 0; padding: 2rem; }
    h1 { font-size: 1.3rem; }
    .card { background: #16294f; border-radius: 8px; padding: 1.5rem; max-width: 640px; }
    pre { background: #0f2143; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; }
    a { color: #f4b400; text-decoration: none; }
  </style>
</head>
<body>
  <h1>✅ اعمال شد</h1>
  <div class="card">
    <p>{{ applied|length }} ردیف نوشته شد، {{ skipped|length }} رد شد.</p>
    <p>حالا می‌تونید اسم/ایمیل/تعداد نفرات باقی‌مونده رو توی <a href="{{ url_for('workflow.complete_list') }}">صفحه تکمیل اطلاعات</a> پر کنید.</p>
    <pre>{{ log_lines|join('\n') }}</pre>
  </div>
  <p><a href="{{ url_for('workflow.import_form') }}">← آپلود جدید</a> · <a href="{{ url_for('main.reservations') }}">رزروها</a></p>
</body>
</html>
