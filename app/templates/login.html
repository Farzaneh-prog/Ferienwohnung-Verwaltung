<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Login — Marktresidenz</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f2143; color: #f5f4f0; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    form { background: #16294f; padding: 2rem; border-radius: 12px; width: 280px; }
    h1 { font-size: 1.2rem; margin-top: 0; }
    label { display: block; margin-top: 1rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; border-radius: 6px; border: 1px solid #3a4a6b; background: #0f2143; color: #fff; box-sizing: border-box; }
    button { margin-top: 1.5rem; width: 100%; padding: 0.6rem; border: none; border-radius: 6px; background: #f4b400; color: #0f2143; font-weight: 600; cursor: pointer; }
    .error { color: #ff8a80; font-size: 0.85rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <form method="post">
    <h1>Marktresidenz — Anmeldung</h1>
    <label>Benutzername
      <input type="text" name="username" autofocus required>
    </label>
    <label>Passwort
      <input type="password" name="password" required>
    </label>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button type="submit">Anmelden</button>
  </form>
</body>
</html>
